name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium

      - name: Render layout fixtures
        run: |
          python tests/render_layout.py
          python tests/test_navigation_states.py
          python tests/test_urlbar_geometry.py
          python tests/test_tab_selected_firefox154.py
          python tests/render_v18_r7_fixture.py
          python tests/render_v18_r9_fixture.py

      - name: Run Firefox 154 regressions
        run: |
          python tests/test_v18_r7_regressions.py
          python tests/test_v18_r8_regressions.py
          python tests/test_v18_r9_toolbar_integration.py

      - name: Run package checks
        run: python test_package.py

  windows:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Test installer with Windows PowerShell 5.1
        shell: powershell
        run: .\tests\test_installer.ps1

      - name: Install official Firefox and geckodriver
        shell: pwsh
        run: |
          $setup = Join-Path $env:RUNNER_TEMP 'Firefox-Setup.exe'
          Invoke-WebRequest 'https://download.mozilla.org/?product=firefox-latest-ssl&os=win64&lang=en-US' -OutFile $setup
          # The runner's preinstalled Firefox has its own AutoConfig. Install
          # a clean source separately so the real conflict guard stays intact.
          $sourceDirectory = Join-Path $env:RUNNER_TEMP 'firefox-source'
          $installerArguments = '/S /InstallDirectoryPath="' + $sourceDirectory + '"'
          $result = Start-Process -FilePath $setup -ArgumentList $installerArguments -WindowStyle Hidden -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "Firefox setup failed: $($result.ExitCode)" }
          $sourceExecutable = Join-Path $sourceDirectory 'firefox.exe'
          if (-not (Test-Path -LiteralPath $sourceExecutable)) { throw 'The clean Firefox source is missing' }
          "WHITESUR_TEST_FIREFOX=$sourceExecutable" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $archive = Join-Path $env:RUNNER_TEMP 'geckodriver.zip'
          Invoke-WebRequest 'https://github.com/mozilla/geckodriver/releases/download/v0.37.1/geckodriver-v0.37.1-win64.zip' -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath (Join-Path $env:RUNNER_TEMP 'geckodriver')

      - name: Test editable tabs in native Firefox
        shell: pwsh
        run: |
          python tests/test_editable_tabs_firefox.py --firefox "$env:WHITESUR_TEST_FIREFOX" --geckodriver "$env:RUNNER_TEMP\geckodriver\geckodriver.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test search-engine pill in editable and classic Firefox
        shell: pwsh
        run: |
          python tests/test_search_mode_firefox.py --firefox "$env:WHITESUR_TEST_FIREFOX" --geckodriver "$env:RUNNER_TEMP\geckodriver\geckodriver.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test editor motion and middle-click closing in Firefox
        shell: pwsh
        run: |
          python tests/test_tab_motion_firefox.py --firefox "$env:WHITESUR_TEST_FIREFOX" --geckodriver "$env:RUNNER_TEMP\geckodriver\geckodriver.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test native window titlebar hit-testing and double-click
        shell: pwsh
        run: |
          python tests/test_window_titlebar_firefox.py --firefox "$env:WHITESUR_TEST_FIREFOX" --geckodriver "$env:RUNNER_TEMP\geckodriver\geckodriver.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Firefox test report and screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-firefox-results
          path: tests/artifacts/
          if-no-files-found: ignore
