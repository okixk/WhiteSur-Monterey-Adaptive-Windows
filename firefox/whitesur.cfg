// WhiteSur editable tabs. AutoConfig requires this first line to be a comment.
try {
  const whiteSurServices = globalThis.Services || ChromeUtils.importESModule('resource://gre/modules/Services.sys.mjs').Services;
  defaultPref('userChrome.tabSearch.enabled', true);
  const whiteSurStartup = {
    observe(win) {
      if (whiteSurServices.appinfo.inSafeMode ||
          !whiteSurServices.prefs.getBoolPref('userChrome.tabSearch.enabled', true)) return;
      try {
        const directory = whiteSurServices.dirsvc.get('UChrm', Ci.nsIFile);
        const marker = directory.clone();
        marker.append('.whitesur-monterey-adaptive-windows');
        const script = directory.clone();
        script.append('tab-search.uc.js');
        if (!marker.exists() || !script.exists()) return;
        whiteSurServices.io.getProtocolHandler('resource')
          .QueryInterface(Ci.nsIResProtocolHandler)
          .setSubstitution('whitesur', whiteSurServices.io.newFileURI(directory));
        whiteSurServices.scriptloader.loadSubScript(
          'resource://whitesur/tab-search.uc.js?v=' + script.lastModifiedTime, win, 'UTF-8');
      } catch (error) { Cu.reportError('WhiteSur editable tabs: ' + error); }
    }
  };
  whiteSurServices.obs.addObserver(whiteSurStartup, 'browser-delayed-startup-finished');
} catch (error) { Cu.reportError('WhiteSur loader: ' + error); }
